name: Unzip Game Files
on:
  push:
    branches: [ main ]
jobs:
  unzip-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Extract zip file
        run: |
          unzip Archive.zip
          rm Archive.zip
      - name: Deploy to Main Branch
        uses: mikeal/publish-to-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: 'main'
